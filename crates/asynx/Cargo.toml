[package]
name = "scidev-asynx"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util"] }
futures-executor = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink", "channel"] }
futures-channel = "0.3"
pin-project = "1.1.13"

[features]
tokio-rt = ["tokio/rt-multi-thread"]

[lints]
workspace = true
